<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Play Family Fun Games</title>

  <meta
    name="description"
    content="Scan, play and challenge your family with Family Fun Games."
  >

  <meta name="theme-color" content="#ff4f91">

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <main
    style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
      text-align:center;
    "
  >

    <section
      style="
        width:100%;
        max-width:650px;
        padding:45px 25px;
        border-radius:35px;
        background:linear-gradient(
          135deg,
          #ff4f91,
          #ff8a00,
          #673cff
        );
        color:white;
        box-shadow:0 25px 70px rgba(0,0,0,.22);
      "
    >

      <div style="font-size:70px;">
        🎮
      </div>

      <div
        style="
          font-size:14px;
          font-weight:900;
          letter-spacing:3px;
          margin-bottom:8px;
        "
      >
        YOU'RE IN
      </div>

      <h1
        style="
          font-size:clamp(38px,8vw,65px);
          margin:0 0 12px;
          font-weight:1000;
        "
      >
        FAMILY FUN
      </h1>

      <p
        style="
          font-size:20px;
          line-height:1.5;
          margin:0 auto 25px;
          max-width:500px;
        "
      >
        Games, challenges, mysteries and
        family competition are waiting.
      </p>

      <a
        href="./index.html"
        style="
          display:inline-block;
          padding:16px 28px;
          border-radius:16px;
          background:white;
          color:#20243a;
          text-decoration:none;
          font-weight:1000;
          font-size:18px;
        "
      >
        START PLAYING 🎮
      </a>

    </section>

  </main>

</body>
</html>
