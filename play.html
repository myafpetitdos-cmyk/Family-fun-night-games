<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Play Family Fun Games | Free Family Games Online
  </title>

  <meta
    name="description"
    content="Play Family Fun Games online for free. Discover family-friendly brain teasers, trivia, puzzles, mysteries, word games and arcade challenges."
  >

  <meta
    name="robots"
    content="index, follow, max-image-preview:large"
  >

  <meta
    name="theme-color"
    content="#ff4f91"
  >

  <meta
    name="application-name"
    content="Family Fun Games"
  >

  <link
    rel="canonical"
    href="https://family-fun-night-games.vercel.app/play.html"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="apple-touch-icon"
    href="icons/icon-192.png"
  >

  <!-- Open Graph -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:title"
    content="Play Family Fun Games"
  >

  <meta
    property="og:description"
    content="Play free family-friendly games, puzzles, trivia, mysteries and arcade challenges."
  >

  <meta
    property="og:url"
    content="https://family-fun-night-games.vercel.app/play.html"
  >

  <meta
    property="og:site_name"
    content="Family Fun Games"
  >

  <!-- Twitter / X -->

  <meta
    name="twitter:card"
    content="summary"
  >

  <meta
    name="twitter:title"
    content="Play Family Fun Games"
  >

  <meta
    name="twitter:description"
    content="Play free family games, puzzles, trivia, mysteries and arcade challenges."
  >

  <!-- Structured Data -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Play Family Fun Games",
    "url": "https://family-fun-night-games.vercel.app/play.html",
    "description": "Play free family-friendly games, puzzles, trivia, mysteries and arcade challenges.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Family Fun Games",
      "url": "https://family-fun-night-games.vercel.app/"
    }
  }
  </script>

</head>


<body>


  <main
    style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:25px;
      text-align:center;
    "
  >

    <section
      style="
        width:100%;
        max-width:650px;
        padding:45px 25px;
        border-radius:35px;
        background:linear-gradient(
          135deg,
          #ff4f91,
          #ff8a00,
          #673cff
        );
        color:white;
        box-shadow:0 25px 70px rgba(0,0,0,.22);
      "
    >

      <div
        style="
          font-size:70px;
          line-height:1;
          margin-bottom:15px;
        "
        aria-hidden="true"
      >
        🎮
      </div>


      <div
        style="
          font-size:14px;
          font-weight:900;
          letter-spacing:3px;
          margin-bottom:8px;
        "
      >
        YOU'RE IN
      </div>


      <h1
        style="
          font-size:clamp(38px,8vw,65px);
          margin:0 0 12px;
          font-weight:1000;
        "
      >
        FAMILY FUN
      </h1>


      <p
        style="
          font-size:20px;
          line-height:1.5;
          margin:0 auto 25px;
          max-width:500px;
        "
      >
        Free games, challenges, mysteries,
        puzzles and family competition are waiting.
      </p>


      <a
        href="./index.html"
        aria-label="Start playing Family Fun Games"
        style="
          display:inline-block;
          padding:16px 28px;
          border-radius:16px;
          background:white;
          color:#20243a;
          text-decoration:none;
          font-weight:1000;
          font-size:18px;
        "
      >
        START PLAYING 🎮
      </a>


      <div
        style="
          margin-top:25px;
          font-size:14px;
          font-weight:700;
          opacity:.9;
        "
      >
        Brain teasers • Trivia • Puzzles • Mysteries • Arcade
      </div>


      <div
        style="
          margin-top:22px;
        "
      >

        <a
          href="./index.html"
          style="
            color:white;
            font-weight:800;
            text-decoration:underline;
          "
        >
          ← Back to Family Fun Games
        </a>

      </div>

    </section>

  </main>


</body>

</html>
