<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Fun Night</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
min-height:100vh;
background:
radial-gradient(circle at 10% 20%,#ffeb3b 0 5%,transparent 6%),
radial-gradient(circle at 90% 10%,#ff4d6d 0 6%,transparent 7%),
radial-gradient(circle at 80% 85%,#00e5ff 0 7%,transparent 8%),
linear-gradient(135deg,#ff1744,#ff6d00,#ffd600,#00c853,#2979ff,#7c4dff);
background-size:auto;
color:#172033;
}

header{
text-align:center;
padding:25px 15px;
background:rgba(255,255,255,.94);
border-bottom:7px solid #ffd600;
box-shadow:0 8px 25px #0004;
}

.logo{
font-size:clamp(2.2rem,9vw,4.5rem);
font-weight:1000;
color:#ff1744;
text-shadow:3px 3px #ffd600,6px 6px #2979ff;
}

.tagline{
font-size:1.1rem;
font-weight:900;
margin-top:8px;
}

.container{
max-width:850px;
margin:auto;
padding:18px 12px 45px;
}

.topbar{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-bottom:15px;
}

.stat{
background:#fff;
border-radius:18px;
padding:13px 8px;
text-align:center;
font-weight:900;
box-shadow:0 7px 18px #0004;
}

.stat b{
display:block;
font-size:1.5rem;
color:#ff1744;
}

.game{
background:#fff;
border-radius:30px;
overflow:hidden;
box-shadow:0 18px 45px #0005;
}

.gamehead{
padding:20px;
color:#fff;
background:linear-gradient(135deg,#651fff,#2979ff,#00b8d4);
}

.badge{
display:inline-block;
background:#ffd600;
color:#172033;
padding:8px 13px;
border-radius:50px;
font-weight:1000;
}

.gamehead h2{
margin-top:12px;
font-size:clamp(1.4rem,6vw,2rem);
}

.body{
padding:20px;
}

.map{
display:flex;
gap:8px;
overflow-x:auto;
padding:5px 2px 18px;
}

.level{
min-width:65px;
height:65px;
border-radius:50%;
border:4px solid #fff;
background:#d9d9d9;
box-shadow:0 5px 12px #0004;
font-weight:1000;
font-size:1.1rem;
}

.level.active{
background:linear-gradient(135deg,#ff1744,#ff9100);
color:white;
transform:scale(1.08);
}

.level.done{
background:linear-gradient(135deg,#00c853,#64dd17);
color:white;
}

.level.locked{
opacity:.5;
}

.puzzle{
min-height:280px;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#fff9c4,#e1f5fe);
border-radius:22px;
margin-bottom:18px;
padding:20px;
border:4px solid #fff;
box-shadow:inset 0 0 25px #0001;
}

.flagE{
width:min(80vw,330px);
height:min(62vw,245px);
background:repeating-linear-gradient(
to bottom,
#e31b23 0 16px,
#fff 16px 32px
);
clip-path:polygon(
0 0,100% 0,100% 22%,
27% 22%,27% 39%,
88% 39%,88% 61%,
27% 61%,27% 78%,
100% 78%,100% 100%,
0 100%
);
position:relative;
box-shadow:0 12px 25px #0004;
}

.flagE:before{
content:"★ ★ ★\A ★ ★ ★\A ★ ★ ★";
white-space:pre;
position:absolute;
top:0;
left:0;
width:29%;
height:45%;
background:#1746a2;
color:#fff;
font-size:16px;
line-height:1.3;
padding:8px;
}

.emoji{
font-size:clamp(4rem,18vw,8rem);
text-align:center;
}

.bigword{
font-size:clamp(3rem,15vw,7rem);
font-weight:1000;
color:#ff1744;
text-align:center;
text-shadow:4px 4px #ffd600;
}

.riddle{
font-size:clamp(1.3rem,5vw,2rem);
font-weight:900;
text-align:center;
line-height:1.5;
padding:20px;
}

input{
width:100%;
padding:17px;
border:3px solid #2979ff;
border-radius:15px;
font-size:1.1rem;
font-weight:bold;
outline:none;
}

input:focus{
box-shadow:0 0 0 5px #2979ff33;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px;
}

button{
border:0;
border-radius:15px;
padding:16px;
font-size:1rem;
font-weight:1000;
cursor:pointer;
}

.check{
background:linear-gradient(135deg,#ff1744,#ff6d00);
color:white;
box-shadow:0 5px #b71c1c;
}

.hint{
background:#ffd600;
color:#332600;
}

.next{
background:linear-gradient(135deg,#00c853,#64dd17);
color:white;
display:none;
}

.answer{
margin-top:14px;
padding:14px;
border-radius:15px;
text-align:center;
font-weight:1000;
display:none;
}

.correct{
display:block;
background:#c8f7d2;
color:#087f35;
}

.wrong{
display:block;
background:#ffd5d9;
color:#b00020;
}

.hintbox{
display:none;
margin-top:12px;
padding:14px;
background:#fff3cd;
border-radius:14px;
font-weight:bold;
}

.progress{
height:15px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:20px;
}

.progressbar{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff1744,#ffd600,#00c853,#2979ff);
transition:.4s;
}

.finish{
display:none;
text-align:center;
padding:30px 15px;
}

.finish h2{
font-size:2.5rem;
color:#ff1744;
}

.finish button{
margin-top:20px;
background:linear-gradient(135deg,#651fff,#2979ff);
color:white;
width:100%;
}

@media(max-width:600px){
.buttons{grid-template-columns:1fr}
.topbar{grid-template-columns:1fr 1fr 1fr}
.stat{font-size:.8rem}
}
</style>
</head>

<body>

<header>
<div class="logo">🍭 Family Fun Night 🎉</div>
<div class="tagline">Think • Laugh • Play • Win!</div>
</header>

<div class="container">

<div class="topbar">
<div class="stat">⭐ SCORE<b id="score">0</b></div>
<div class="stat">🔥 STREAK<b id="streak">0</b></div>
<div class="stat">🏆 LEVEL<b id="level">1</b></div>
</div>

<div class="game">

<div class="gamehead">
<div class="badge" id="category">🧩 Picture Puzzle</div>
<h2 id="title">Level 1</h2>
</div>

<div class="body">

<div class="map" id="levelMap"></div>

<div class="puzzle" id="puzzle"></div>

<input id="answer" placeholder="Type your answer..." autocomplete="off">

<div class="buttons">
<button class="check" onclick="checkAnswer()">🚀 CHECK ANSWER</button>
<button class="hint" onclick="showHint()">💡 HINT</button>
<button class="next" id="next" onclick="nextLevel()">➡️ NEXT LEVEL</button>
</div>

<div id="feedback" class="answer"></div>
<div id="hintbox" class="hintbox"></div>

<div class="progress">
<div class="progressbar" id="progress"></div>
</div>

</div>
</div>

<div class="finish" id="finish">
<h2>🎉 YOU DID IT! 🎉</h2>
<p id="final"></p>
<button onclick="restart()">🔄 PLAY AGAIN</button>
</div>

</div>

<script>

const levels=[

{
cat:"🇺🇸 PICTURE PUZZLE",
title:"American Brain Buster",
type:"flag",
answers:["freedom","american freedom","america"],
hint:"Look at the letter and what it is made from."
},

{
cat:"🧠 BRAIN GAME",
title:"What Word Is Hiding?",
type:"word",
display:"STAND<br>I",
answers:["understand","i understand"],
hint:"The letter I is underneath the word."
},

{
cat:"😂 RIDDLE",
title:"Riddle Me This!",
type:"riddle",
display:"I have a face and two hands,<br>but I cannot clap.<br><br>What am I?",
answers:["clock","a clock"],
hint:"You look at me to know the time."
},

{
cat:"🎯 EMOJI CHALLENGE",
title:"Guess The Phrase",
type:"emoji",
display:"🧠 + 💪",
answers:["brain power","brainpower"],
hint:"Think smart!"
},

{
cat:"🔤 WORD SCRAMBLE",
title:"Unscramble It!",
type:"word",
display:"Y A M I L F",
answers:["family"],
hint:"It is the most important part of Family Fun Night."
},

{
cat:"🤣 LITTLE KIDS",
title:"Emoji Guess!",
type:"emoji",
display:"🐝 + 🍃",
answers:["believe"],
hint:"Say the two pictures together."
},

{
cat:"🏆 SUPER BRAIN",
title:"Final Challenge",
type:"riddle",
display:"What has keys<br>but cannot open a door?",
answers:["piano","a piano"],
hint:"You can play music on it."
},

{
cat:"🌟 BONUS LEVEL",
title:"One More!",
type:"emoji",
display:"🌞 + 🌻",
answers:["sunflower","sun flower"],
hint:"Put the two pictures together."
}

];

let current=0;
let score=0;
let streak=0;
let answered=false;

function renderLevels(){

const map=document.getElementById("levelMap");

map.innerHTML="";

levels.forEach((_,i)=>{

const b=document.createElement("button");

b.className="level";

if(i<current)b.classList.add("done");
if(i===current)b.classList.add("active");
if(i>current)b.classList.add("locked");

b.textContent=i+1;

if(i<=current)b.onclick=()=>{
current=i;
load();
};

map.appendChild(b);

});

}

function load(){

answered=false;

const l=levels[current];

document.getElementById("category").textContent=l.cat;
document.getElementById("title").textContent=l.title;
document.getElementById("level").textContent=current+1;

const p=document.getElementById("puzzle");

if(l.type==="flag"){
p.innerHTML='<div class="flagE"></div>';
}

if(l.type==="word"){
p.innerHTML='<div class="bigword">'+l.display+'</div>';
}

if(l.type==="emoji"){
p.innerHTML='<div class="emoji">'+l.display+'</div>';
}

if(l.type==="riddle"){
p.innerHTML='<div class="riddle">'+l.display+'</div>';
}

document.getElementById("answer").value="";
document.getElementById("answer").disabled=false;

document.getElementById("feedback").className="answer";
document.getElementById("feedback").textContent="";

document.getElementById("hintbox").style.display="none";

document.getElementById("next").style.display="none";

document.getElementById("progress").style.width=
((current+1)/levels.length*100)+"%";

renderLevels();

}

function checkAnswer(){

if(answered)return;

const input=document.getElementById("answer")
.value.trim().toLowerCase();

if(!input){

showFeedback("✏️ Type an answer first!","wrong");
return;

}

const correct=levels[current].answers.includes(input);

if(correct){

answered=true;

score+=100;

streak++;

document.getElementById("score").textContent=score;
document.getElementById("streak").textContent=streak;

showFeedback(
"🎉 CORRECT! +100 POINTS! 🔥",
"correct"
);

document.getElementById("answer").disabled=true;

if(current<levels.length-1){
document.getElementById("next").style.display="block";
}else{
setTimeout(finish,700);
}

}else{

streak=0;

document.getElementById("streak").textContent=0;

showFeedback(
"❌ Not quite! Try again!",
"wrong"
);

}

}

function showFeedback(text,type){

const f=document.getElementById("feedback");

f.textContent=text;
f.className="answer "+type;

}

function showHint(){

const h=document.getElementById("hintbox");

h.textContent="💡 "+levels[current].hint;
h.style.display="block";

}

function nextLevel(){

if(current<levels.length-1){

current++;
load();

}

}

function finish(){

document.querySelector(".game").style.display="none";

document.getElementById("finish").style.display="block";

document.getElementById("final").innerHTML=
"You scored <strong>"+score+
"</strong> points and reached Level "+
(current+1)+"!<br><br>🏆 Family Fun Champion! 🏆";

}

function restart(){

current=0;
score=0;
streak=0;

document.getElementById("score").textContent=0;
document.getElementById("streak").textContent=0;

document.querySelector(".game").style.display="block";
document.getElementById("finish").style.display="none";

load();

}

document.getElementById("answer").addEventListener("keydown",function(e){

if(e.key==="Enter")checkAnswer();

});

load();

</script>

</body>
</html>
